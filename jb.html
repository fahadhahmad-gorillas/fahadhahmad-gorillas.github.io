<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PLAYBOX SIDOARJO</title>
    <style>
      html,
		body {
		 margin: 0;
		 padding: 0;
		 min-height: 100%;
		 background: #0b0d10 url("bg.jpg") center center / cover no-repeat fixed;
		 color: #c8ced8;
	    font:
		 15px/1.45 "Segoe UI",
		 system-ui,
		 sans-serif;
		}
      #brand {
        text-align: center;
        padding: 8px 10px;
        background: #0e1116;
        border-bottom: 1px solid #1e2732;
      }
      #brand img {
        width: 28px;
        height: 28px;
        margin-right: 8px;
        border-radius: 50%;
        vertical-align: middle;
      }
      #brand b {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #e6ebf2;
        vertical-align: middle;
      }

      /* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid #1e2732;
        border-top-color: #7fd0a0;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
        display: none;
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: #11151b;
        border: 1px solid #1e2732;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
      }
      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #d08a7f;
      }
      .warn {
        color: #d8c07f;
      }
      .safe {
        color: #7fd0a0;
      }
      .danger {
        color: #d08a7f;
      }
      code {
        color: #9fb3d0;
      }
	  body::before {
		  content: "";
		  position: fixed;
		  inset: 0;
		  background: rgba(11, 13, 16, 0.45);
		  z-index: 0;
		  pointer-events: none;
		}

		#brand {
		  position: relative;
		  z-index: 1;
		}

		#spin,
		#msg {
		  z-index: 1;
		}

		#wrap {
		  padding: 0;
		  position: relative;
		  z-index: 1;
		}

		#waitText {
		  position: fixed;
		  top: calc(50% + 80px);
		  left: 0;
		  right: 0;
		  transform: translateY(-50%);
		  text-align: center;
		  font-size: 14px;
		  letter-spacing: 0.08em;
		  color: #ffffff;
		  z-index: 1;
		  text-shadow: 0 0 6px #000, 0 0 12px #000;
		}

		body.done #waitText,
		body.fail #waitText,
		body.log  #waitText { display: none; }
    </style>
